name: Release

# Triggered by version tags pushed by semantic-release (e.g. v0.14.0).
# Builds the kairo binary for Linux x86_64 and aarch64, packages each
# into a tarball, and uploads both to a GitHub Release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            packages: >-
              cmake pkg-config
              libxkbcommon-dev libxkbcommon-x11-dev
              libwayland-dev libvulkan-dev
              libx11-dev libxcb1-dev libxcb-xkb-dev
          - target: aarch64-unknown-linux-gnu
            packages: >-
              cmake pkg-config
              gcc-aarch64-linux-gnu
              libxkbcommon-dev libxkbcommon-x11-dev
              libwayland-dev libvulkan-dev
              libx11-dev libxcb1-dev libxcb-xkb-dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up vendor dependencies
        run: bash scripts/setup-vendor.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure cross-linker (aarch64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        run: cargo build --release -p kairo-ui --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="kairo-${VERSION}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/kairo" kairo
          tar -czf "${TARBALL}" kairo
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Kairo ${GITHUB_REF_NAME}" \
            --generate-notes \
            2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" "${TARBALL}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
