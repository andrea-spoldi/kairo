name: Release

# Triggered by version tags pushed by semantic-release (e.g. v0.14.0).
# Builds the kairo binary for Linux x86_64, packages it with the icon
# and .desktop file, and uploads to a GitHub Release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up vendor dependencies
        run: bash scripts/setup-vendor.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            cmake pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev \
            libx11-dev libxcb1-dev libxcb-xkb-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p kairo-ui

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="kairo-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p kairo-pkg
          cp target/release/kairo        kairo-pkg/kairo
          cp assets/icons/kairo.png      kairo-pkg/kairo.png
          cp assets/kairo.desktop        kairo-pkg/kairo.desktop
          tar -czf "${TARBALL}" -C kairo-pkg .
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Kairo ${GITHUB_REF_NAME}" \
            --generate-notes \
            2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" "${TARBALL}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
