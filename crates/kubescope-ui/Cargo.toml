[package]
name = "kubescope-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "kubescope"
path = "src/main.rs"

# System packages required to compile GPUI on Linux.
# cargo-dist injects these via apt before the build step.
[package.metadata.dist.dependencies.apt]
cmake = '*'
pkg-config = '*'
libxkbcommon-dev = '*'
libxkbcommon-x11-dev = '*'
libwayland-dev = '*'
libvulkan-dev = '*'
libx11-dev = '*'
libxcb1-dev = '*'

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
kubescope-core = { path = "../kubescope-core" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
