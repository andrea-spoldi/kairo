[package]
name = "kairo-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "kairo"
path = "src/main.rs"

# macOS app bundle config (used by `cargo bundle` + make-dmg.sh).
# Run `bash scripts/make-icons.sh` first to generate assets/icons/kairo.icns.
[package.metadata.bundle]
name = "Kairo"
identifier = "dev.kairo.app"
icon = ["assets/icons/kairo.icns"]
category = "Developer Tool"
short_description = "Native Rust Kubernetes observability IDE"
long_description = """
Kairo is a native Rust desktop Kubernetes observability tool built on GPUI.
Real-time pod monitoring, cluster health visualization, live event feeds,
and log streaming — no Electron, no browser, no cloud dependency.
"""
copyright = "Copyright © 2026 Andrea Spoldi"
minimum_system_version = "12.0"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
kairo-config = { path = "../kairo-config" }
kairo-core = { path = "../kairo-core" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
