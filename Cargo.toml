[workspace]
members = [
    "crates/kairo-config",
    "crates/kairo-core",
    "crates/kairo-ui",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.12.0"
authors = ["Andrea Spoldi"]
description = "Native Rust Kubernetes IDE — GPUI + kube-rs, no Electron"
homepage = "https://github.com/andrea-spoldi/kubescope_"
repository = "https://github.com/andrea-spoldi/kubescope_"
license = "MIT"

[patch."https://github.com/longbridge/gpui-component"]
gpui-component = { path = "vendor/gpui-component/crates/ui" }
gpui-component-assets = { path = "vendor/gpui-component/crates/assets" }

[profile.dev]
opt-level = 0
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
